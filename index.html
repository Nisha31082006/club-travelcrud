<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Club & Travel Buddy - Full CRUD</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; }
        .section { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ddd; }
        label { display: block; margin-top: 8px; font-weight: bold; font-size: 13px; }
        input, select { width: 100%; padding: 7px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { margin-top: 12px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; color: white; margin-right: 5px; }
        .btn-create { background: #28a745; }
        .btn-read { background: #17a2b8; }
        .btn-update { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; }
        button:hover { opacity: 0.9; }
        pre { background: #e9ecef; padding: 10px; border-radius: 4px; max-height: 150px; overflow-y: auto; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Campus Club & Travel Buddy - Full CRUD Interface</h2>

        <!-- 1. CAMPUS CLUB MEMBER CRUD -->
        <div class="section">
            <h3>1. Campus Club Member Management</h3>
            <label>Member ID (Required for Search/Update/Delete):</label>
            <input type="text" id="mId" placeholder="e.g. M101">

            <label>Name:</label>
            <input type="text" id="mName" placeholder="e.g. John Doe">

            <label>Club Name:</label>
            <input type="text" id="mClub" placeholder="e.g. Coding Club">

            <label>Year of Study:</label>
            <input type="number" id="mYear" placeholder="e.g. 2">

            <label>Role:</label>
            <input type="text" id="mRole" placeholder="e.g. Member">

            <label>Points:</label>
            <input type="number" id="mPoints" placeholder="e.g. 100">

            <label>Interests (comma separated):</label>
            <input type="text" id="mInterests" placeholder="e.g. Coding, AI">

            <label>Status:</label>
            <input type="text" id="mStatus" value="Active">

            <div class="btn-group">
                <button class="btn-create" onclick="manageMember('create')">Insert / Create</button>
                <button class="btn-read" onclick="manageMember('read')">Search (Read)</button>
                <button class="btn-update" onclick="manageMember('update')">Update</button>
                <button class="btn-delete" onclick="manageMember('delete')">Delete</button>
            </div>
            <pre id="mResult">Result will appear here...</pre>
        </div>

        <!-- 2. TRAVEL BUDDY CRUD -->
        <div class="section">
            <h3>2. Travel Buddy Finder Management</h3>
            <label>Buddy ID (Required for Search/Update/Delete):</label>
            <input type="text" id="bId" placeholder="e.g. B201">

            <label>Name:</label>
            <input type="text" id="bName" placeholder="e.g. Sarah Connor">

            <label>Destination:</label>
            <input type="text" id="bDest" placeholder="e.g. Paris">

            <label>Age:</label>
            <input type="number" id="bAge" placeholder="e.g. 24">

            <label>Budget:</label>
            <input type="number" id="bBudget" placeholder="e.g. 1200">

            <label>Trip Duration:</label>
            <input type="text" id="bDuration" placeholder="e.g. 5 Days">

            <label>Interests (comma separated):</label>
            <input type="text" id="bInterests" placeholder="e.g. History, Art">

            <label>Status:</label>
            <input type="text" id="bStatus" value="Looking">

            <div class="btn-group">
                <button class="btn-create" onclick="manageBuddy('create')">Insert / Create</button>
                <button class="btn-read" onclick="manageBuddy('read')">Search (Read)</button>
                <button class="btn-update" onclick="manageBuddy('update')">Update</button>
                <button class="btn-delete" onclick="manageBuddy('delete')">Delete</button>
            </div>
            <pre id="bResult">Result will appear here...</pre>
        </div>
    </div>

    <script>
        async function manageMember(action) {
            const payload = {
                action: action,
                memberId: document.getElementById('mId').value,
                name: document.getElementById('mName').value,
                clubName: document.getElementById('mClub').value,
                yearOfStudy: Number(document.getElementById('mYear').value),
                role: document.getElementById('mRole').value,
                points: Number(document.getElementById('mPoints').value),
                interests: document.getElementById('mInterests').value,
                status: document.getElementById('mStatus').value
            };

            try {
                const res = await fetch('/api/member-crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                document.getElementById('mResult').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('mResult').innerText = "Error: " + err.message;
            }
        }

        async function manageBuddy(action) {
            const payload = {
                action: action,
                buddyId: document.getElementById('bId').value,
                name: document.getElementById('bName').value,
                destination: document.getElementById('bDest').value,
                age: Number(document.getElementById('bAge').value),
                budget: Number(document.getElementById('bBudget').value),
                tripDuration: document.getElementById('bDuration').value,
                interests: document.getElementById('bInterests').value,
                status: document.getElementById('bStatus').value
            };

            try {
                const res = await fetch('/api/buddy-crud', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                document.getElementById('bResult').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('bResult').innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
